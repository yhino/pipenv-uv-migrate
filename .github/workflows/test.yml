name: Test

on:
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Create venv
      run: uv venv
    - name: Install dependencies
      run: uv pip install -U -r pyproject.toml --all-extras
    - name: Lint
      env:
        RUFF_OUTPUT_FORMAT: github
      run: bash scripts/lint.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.10'
            tox-env: py310
          - python-version: '3.11'
            tox-env: py311
          - python-version: '3.12'
            tox-env: py312
          - python-version: '3.13'
            tox-env: py313
          - python-version: '3.14'
            tox-env: py314
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Dump versions
      run: |
        python --version
        uv --version
    - name: Run Tox
      run: uvx --with tox-uv tox@latest -e ${{ matrix.tox-env }}
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        verbose: true
